name: CI

on:
  push:
    branches: ["main", "develop", "phase/*"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: Run ruff check
        run: ruff check src/ tests/ api/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ api/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      # Python version constrained by xgboost==3.2.0 (requires >=3.10),
      # pinned for pickle-deserialization compatibility with the trained
      # model artifact. Do not add older Python versions (e.g. 3.9) without
      # first verifying dependency compatibility.
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=src/cetp --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=50

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  model-gate:
    name: Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Load model and verify a real prediction
        run: |
          python3 -c "
          from pathlib import Path

          model_path = Path('model/artifacts/base_model.pkl')
          if not model_path.exists():
              print('No model artefact found — skipping evaluation gate')
              print('Add base_model.pkl to model/artifacts/ to enable this gate')
              raise SystemExit(0)

          from cetp.predictor import CETPPredictor

          p = CETPPredictor()
          result = p.predict('resnet18', 3, cpu_count=4, total_memory_mb=8192)
          assert result['predicted_runtime_sec'] > 0, 'Model produced invalid prediction'
          assert result['confidence_status'] in ('RELIABLE', 'EXTRAPOLATED')
          print('Model gate: PASS')
          "

  integration-smoke:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test CLI commands work
        run: |
          cetp --version
          cetp --help
          cetp profile
          cetp info
          cetp schema
          cetp validate --help
          cetp predict --help
          cetp train --help

      - name: Test API starts and health endpoint responds
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -sf http://localhost:8000/health | python3 -m json.tool
          curl -sf http://localhost:8000/schema | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'required_columns' in d, 'missing required_columns'"
          curl -sf http://localhost:8000/predict/profile | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'cpu_cores' in d, 'missing cpu_cores'"
          echo "All smoke tests passed"

      - name: Test cetp validate with valid CSV
        run: |
          cetp schema --export /tmp/template.csv
          python3 -c "
          import csv

          # Read the template
          with open('/tmp/template.csv') as f:
              reader = csv.DictReader(f)
              template_row = next(reader)

          # Write 150 identical rows (above MIN_ROW_COUNT=100)
          with open('/tmp/test_data.csv', 'w', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=list(template_row.keys()))
              writer.writeheader()
              for _ in range(150):
                  writer.writerow(template_row)
          print('Created test CSV with 150 rows')
          "
          cetp validate --data /tmp/test_data.csv
